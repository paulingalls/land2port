[package]
name = "land2port"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1" }
argh = "0.1.13"
# Upstream usls, pinned. Device features (coreml/cuda/tensorrt) are added
# per-platform below so macOS doesn't pull the CUDA/TensorRT ORT providers.
usls = { git = "https://github.com/paulingalls/usls", rev = "882cf48b31dabf43a63a5b463607c79652ac384c", features = ["video", "viewer"] }
image = "0.25"
image-compare = "0.4.2"
# SIMD-accelerated resize (AVX2 on x86, NEON on Apple Silicon) for the crop
# render stage; several times faster than image::imageops scalar resize.
fast_image_resize = "5.1"
openai-api-rs = "6.0.6"
tokio = { version = "1", features = ["full"] }
chrono = "0.4.41"
ndarray = "0.16.1"
slsl = { version = "0.0.5", features = ["rayon"] }
# Used directly to encode the cropped output video to a deterministic path
# (the new usls Viewer auto-generates output paths and offers no save-path API).
video-rs = { version = "0.11.0", features = ["ndarray"] }

[target.'cfg(target_os = "macos")'.dependencies]
usls = { git = "https://github.com/paulingalls/usls", rev = "882cf48b31dabf43a63a5b463607c79652ac384c", features = ["coreml"] }

[target.'cfg(target_os = "linux")'.dependencies]
usls = { git = "https://github.com/paulingalls/usls", rev = "882cf48b31dabf43a63a5b463607c79652ac384c", features = ["cuda", "tensorrt"] }
